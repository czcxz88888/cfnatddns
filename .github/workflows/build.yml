name: Android CI Build

# 触发条件：当推送代码到 main 分支，或者手动点击运行按钮时触发
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许在 GitHub 网页端手动点击按钮打包

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 运行环境

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. 配置 Java 21 环境 (当前项目必需)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. 安装指定版本的 Gradle 9.3.1 (替代 gradlew)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true # 禁用缓存避免 GitHub 服务故障

      # 4. 创建环境变量空文件 (防止报错)
      - name: Create empty .env if missing
        run: touch .env

      # 5. 还原 Android 签名证书 (非常重要，否则无法打包)
      - name: Decode debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      # 6. 执行打包命令 (使用全局 gradle 而不是 ./gradlew)
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon --no-configuration-cache

      # 7. 上传生成的 APK 文件，供用户下载
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk # 下载时的压缩包名称
          path: app/build/outputs/apk/debug/*.apk # 提取 APK 的路径
