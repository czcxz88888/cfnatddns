name: Android CI Build

# 触发条件：当推送代码到 main 分支，或者手动点击运行按钮时触发
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许在 GitHub 网页端手动点击按钮打包

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 运行环境

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. 配置 Java 17 环境 (现代 Android 开发的标配)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle # 自动缓存 Gradle 依赖，加快后续打包速度

      # 3. 赋予 Gradle 包装器执行权限 (Linux 环境必备)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 执行打包命令 (生成 Debug 版本的 APK)
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 5. 上传生成的 APK 文件，供用户下载
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk # 你下载时的压缩包名称
          path: app/build/outputs/apk/debug/*.apk # 提取 APK 的路径
