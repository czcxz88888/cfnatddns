name: Android CI Build

# 触发条件：当推送代码到 main 分支，或者手动点击运行按钮时触发
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 配置 Java 21 环境 (当前项目必需)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 安装指定版本的 Gradle 9.3.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      # 创建环境变量空文件 (防止报错)
      - name: Create empty .env if missing
        run: touch .env

      # ----------------------------------------------------
      # ⬇️ ⬇️ 就是缺了这一步！还原 Android 签名证书 ⬇️ ⬇️
      # ----------------------------------------------------
      - name: Decode debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Error: debug.keystore.base64 not found in repository!"
            exit 1
          fi

      # 执行打包命令
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon --no-configuration-cache

      # 上传生成的 APK 文件
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
