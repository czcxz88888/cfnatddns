name: Android CI Build

# 触发条件：当推送代码到 main 分支，或者手动点击运行按钮时触发
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 配置 Java 21 环境 (当前项目必需)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 安装指定版本的 Gradle 9.3.1
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      # 创建环境变量空文件 (防止报错)
      - name: Create empty .env if missing
        run: touch .env

      # ----------------------------------------------------
      # 智能处理签名文件：如果不存在，则自动生成并提交回代码库以保持签名永久一致！
      # ----------------------------------------------------
      - name: Prepare and Persist debug.keystore
        run: |
          if [ -f debug.keystore ]; then
            echo "Using existing debug.keystore from repository."
          else
            echo "Generating a permanent debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
            
            echo "Committing the new keystore to the repository..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "chore: Auto-generate permanent signing keystore"
            git push
          fi

      # 执行打包命令
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon --no-configuration-cache

      # 上传生成的 APK 文件
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # 自动发布所有的变体安装包到 Release
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.4.${{ github.run_number }}"
          name: "cfnatddns v1.4.${{ github.run_number }}"
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
